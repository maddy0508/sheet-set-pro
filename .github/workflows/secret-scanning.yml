# Secret scanning baseline for Sheet Set Pro.
# Detection only: this workflow does not build, test, deploy or publish anything.
# It deliberately uses no third-party GitHub Actions. The environment currently fails to
# resolve external actions at job startup (see CI Readiness Report), and a pure-shell job
# is also the smallest possible supply-chain surface.
name: Secret Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only reads repository content.
permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Fetch repository history
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir --parents scan
          cd scan
          git init --quiet
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch --quiet --prune --force --tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          # Drop the credential from local config before anything else runs.
          git remote set-url origin "https://github.com/${REPO}.git"

      - name: Install Gitleaks 8.30.1 (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --silent --show-error --fail --location --retry 3 --output "/tmp/${archive}" "$url"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict -
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          install --mode 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps detected values out of the job log.
      # --log-opts="--all" scans every reachable commit, not just the tip.
      - name: Scan full Git history
        run: |
          set -euo pipefail
          cd scan
          gitleaks git \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 \
            .
